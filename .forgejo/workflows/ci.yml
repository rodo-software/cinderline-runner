# Linux CI for Forgejo; macOS and Windows run in .github/workflows/ci.yml; see decision 2026-11-05-ci.
name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: staticcheck ./...
      - run: go test -race ./...
      - run: govulncheck ./...
