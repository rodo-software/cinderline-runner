# Draft for Willem (CSR-41): agents may not edit .github/ (AGENTS.md; decision
# 2026-11-05-ci), so this file waits here. To put it in place:
#   1. Copy this file to .github/workflows/release.yml and merge it to main.
#   2. Tag a release on main and push the tag, for example
#      git tag v0.1.0 && git push origin v0.1.0. A tag with a pre-release
#      suffix such as v0.1.0-rc1 is marked as a pre-release.
#   3. Check the release page: six archives, checksums.txt, and release notes
#      that start with the pinned Claude Code, OpenCode and ponytail versions,
#      followed by the commits since the previous tag. Check the attestation
#      with: gh attestation verify <archive> --repo rodo-software/cinderline-runner
# The release runs on GitHub Actions, not Forgejo, because artifact
# attestations exist only there (decision 2026-11-05-ci; decision
# 2026-11-05-runner-rewrite-details item 16). There is no signing key: the
# installers verify SHA-256 against checksums.txt, and the attestation ties
# checksums.txt and every archive to this workflow run.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write # GoReleaser creates the release and uploads the archives
  id-token: write # attest-build-provenance signs with the workflow's identity
  attestations: write # and stores the attestation on the repository
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog lists the commits since the previous tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Written outside the checkout: GoReleaser refuses a dirty git tree and
      # --clean empties dist/ before it starts.
      - run: go run ./internal/tools/releasenotes > "$RUNNER_TEMP/release-header.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --release-header ${{ runner.temp }}/release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
