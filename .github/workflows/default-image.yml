# Builds images/default/Dockerfile and pushes
# ghcr.io/rodo-software/cinderline-runner-default:<Dockerfile sum> with build
# provenance and an SBOM. It runs only when the Dockerfile changes on main, or
# by hand (Actions > default-image > Run workflow): runners pull the image by
# its pinned digest, so rebuilding an unchanged Dockerfile on every release tag
# made nothing new (decision 2026-11-12-ci-speedups).
# After a run, the job summary shows the image's digest and the Dockerfile's
# sum. Put them in internal/environment/docker.go as publishedDigest and
# publishedSum and commit; the next release then pulls that image. Until then,
# runners build locally. Check the attestation with:
#   gh attestation verify oci://ghcr.io/rodo-software/cinderline-runner-default@<digest> --repo rodo-software/cinderline-runner
# The image holds no agent CLIs (decision 2026-11-04-licences-before-publishing):
# they come from the tools volume.
name: default-image
on:
  push:
    branches:
      - main
    paths:
      - images/default/**
      - .github/workflows/default-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # attest-build-provenance signs with the workflow's identity
  attestations: write # and stores the attestation on the repository
concurrency:
  group: default-image
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/rodo-software/cinderline-runner-default
jobs:
  image:
    # shortcut: linux/arm64 only, built natively (no QEMU), for Docker on Apple
    # silicon (decision 2026-11-12-ci-speedups). Other machines fail the pull and
    # build locally (environment.Docker.Image). For amd64, add a native
    # ubuntu-latest job and merge both digests into one manifest list.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - id: sum
        run: echo "sum=$(sha256sum images/default/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/default
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sum.outputs.sum }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pin
        run: |
          {
            echo "publishedDigest = \"${{ steps.build.outputs.digest }}\""
            echo "publishedSum = \"${{ steps.sum.outputs.sum }}\""
          } >> "$GITHUB_STEP_SUMMARY"
