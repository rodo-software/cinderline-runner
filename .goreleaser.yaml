version: 2
project_name: cinderstack
builds:
  - main: ./cmd/...
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt

# The release notes start with the pinned agent CLIs (R14). GoReleaser OSS
# cannot load a header from a file in its config, so the release workflow
# (docs/ci/release.yml) runs `go run ./internal/tools/releasenotes` and
# passes the result as --release-header.
release:
  prerelease: auto
changelog:
  sort: asc
