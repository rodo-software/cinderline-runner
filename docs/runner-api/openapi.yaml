openapi: 3.1.0
info:
  title: Cinderline runner API
  version: 2.0.0
  license:
    name: Functional Source License, Version 1.1, ALv2 Future License
    identifier: FSL-1.1-ALv2
  description: |
    The REST API between a Cinderline instance and the runner of one project
    (decision 2026-11-16-runner-protocol-v2). It has three requests. The app
    decides; the runner does the mechanics (containers, git, the forge, the
    agent CLIs) and reports facts. The runner never reads or writes an issue:
    the app writes everything a person reads.

    This file is authored in the app repository, where a test checks it
    against the routes, and copied to the runner repository.

    **Authentication.** Every request needs a Sanctum personal access token as
    a bearer token that carries the `runner` ability. The token belongs to the
    runner user of exactly one project, and every request is limited to that
    project:

    - no or an invalid token: `401`;
    - a valid token without the `runner` ability (a person's token, a scoped
      agent token): `403`;
    - an issue of another project, or one that does not exist: `404`, so a
      token never learns what exists outside its project.

    **Versions.** Every request carries `Cinderline-Runner-Version`. Any
    request may get `426` with the minimum runner version. Every response,
    including errors, carries `Cinderline-Api-Version`. Both sides ignore
    properties they do not know.

    **Unavailable.** Any request may get `429` or `503` with `Retry-After`. A
    `next` request that gets no answer is tried again after 2 and 8 seconds
    with the same `id`. A first request (`state` null) that still gets no
    answer is dropped: the run did not start and the issue stays in To do.
    After any later one the runner pushes the work, keeps the session as
    `paused`, ends the run and sends the request again before each poll until
    it is delivered, ignoring its answer.

    **Issue references** such as `CSR-9`, or `CSR-9.2` for a sub-issue,
    identify issues. A reference with the project's key from before a rename
    names the same issue.

    **Caps.** Every `maxItems` and `maxLength` below is enforced: a request
    over one gets `422`, so the runner clips to them. Lengths count
    characters.
servers:
  - url: '{instance}/api/runner/v2'
    variables:
      instance:
        default: https://cinderline.example.com
        description: Base URL of the Cinderline instance.
security:
  - runnerToken: []
paths:
  /poll:
    post:
      operationId: poll
      summary: The runner's one timed request, and its heartbeat.
      description: |
        Sent every `poll_after` seconds, all the time, also during a run. The
        app, in this order: stores the report and the heartbeat; moves every
        active top-level In progress issue with a team, or of the Project
        Manager, that is not in `running` to Blocked with a note; names the
        runs to stop; offers a job to an idle runner, and a Project Manager
        job to a free manager slot; and, when asked, says what to do with held
        sessions and which Review branches to keep current.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollRequest'
      responses:
        '200':
          description: What the runner does until its next poll.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Invalid'
        '426':
          $ref: '#/components/responses/UpgradeRequired'

  /runs/{ref}/next:
    post:
      operationId: nextStep
      summary: Every step of a run.
      description: |
        `ref` is a top-level issue. The runner sends this before the first
        step and after every step, and does the step it gets, until it gets
        `done`. The first request (`state` null) claims the issue: To do to
        In progress. The app keeps the answer to the run's latest request for
        a day and gives it again for the same `id` without doing anything
        twice; a request with another `id` replaces it. A request's
        writes happen all together or not at all. A `state` that is not of
        this issue's run is refused with `422` on `state`, before anything is
        written.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
        - $ref: '#/components/parameters/Ref'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextRequest'
      responses:
        '200':
          description: The step to do next.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            The first request could not claim the issue: it is not in To do,
            it or its project is archived, or the project's runners are
            paused. The runner drops the job.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [message, status]
                properties:
                  message:
                    type: string
                  status:
                    $ref: '#/components/schemas/IssueStatus'
        '422':
          $ref: '#/components/responses/Invalid'
        '426':
          $ref: '#/components/responses/UpgradeRequired'

  /issues/{ref}/attachments/{id}:
    get:
      operationId: downloadAttachment
      summary: The bytes of a file a `run` step named.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
        - $ref: '#/components/parameters/Ref'
        - name: id
          in: path
          required: true
          description: The attachment's `id` in the step, on the step's `issue`.
          schema:
            type: integer
      responses:
        '200':
          description: The file, with its type and the header `X-Content-Type-Options` set to `nosniff`.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'

components:
  securitySchemes:
    runnerToken:
      type: http
      scheme: bearer
      description: A Sanctum personal access token of the project's runner user with the `runner` ability.
  parameters:
    RunnerVersion:
      name: Cinderline-Runner-Version
      in: header
      required: true
      description: The runner's version, e.g. `0.6.0`. A version that does not start with a digit, such as `dev`, is a local build and is accepted.
      schema:
        type: string
    Ref:
      name: ref
      in: path
      required: true
      description: An issue reference of the token's project, e.g. `CSR-9`.
      schema:
        type: string
  headers:
    ApiVersion:
      description: The version of this API, `2.0.0`.
      schema:
        type: string
  responses:
    Error:
      description: The request was refused; `message` says why.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
    Invalid:
      description: The body is not valid; `errors` has the messages by field.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    UpgradeRequired:
      description: The runner is older than the app serves, or sent no version.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            type: object
            required: [message, minimum_runner_version]
            properties:
              message:
                type: string
              minimum_runner_version:
                type: string
  schemas:
    IssueStatus:
      type: string
      enum: [backlog, todo, in_progress, blocked, review, done, cancelled]

    PollRequest:
      type: object
      description: >-
        With `report`, `running` and `idle` are required too. Without
        `report` the request only asks which project the token belongs to, as
        the runner's `add` does: the answer has `poll_after`, `review_after`
        and `project`, and nothing is stored, blocked or offered.
      properties:
        report:
          $ref: '#/components/schemas/Report'
        running:
          type: array
          maxItems: 20
          description: The top-level issues the runner works on now, and those whose last `next` request still waits in its outbox. A reference the app does not know comes back in `stop`.
          items:
            type: string
            maxLength: 50
        idle:
          type: boolean
          description: The runner can start a run now.
        provider_places:
          type: array
          maxItems: 50
          description: >-
            The free admission places of the runner's model providers that
            have a limit (decision 2026-11-25-provider-places), counted over
            every project and Cinderline instance the runner serves: one entry
            per such provider, `free` being the runs the app may start on it
            now (`max_agents` plus the lookahead, minus the runs in play on
            it). A provider not listed has no limit. Left out, no provider has
            one. It holds for this poll only and is not stored, so it is not
            part of `report`.
          items:
            type: object
            required: [provider, free]
            properties:
              provider:
                type: string
                maxLength: 50
                pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
                description: A name as in `report.model_providers`, at most once in the list.
              free:
                type: integer
                minimum: 0
                maximum: 200
        waiting:
          type: array
          maxItems: 20
          description: >-
            The runs of `running` whose turn waits now for a place on a model
            provider (decision 2026-11-25-provider-places). Left out, none
            waits.
          items:
            type: object
            required: [ref, provider]
            properties:
              ref:
                type: string
                maxLength: 50
              provider:
                type: string
                maxLength: 50
                pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
        manager_idle:
          type: boolean
          description: >-
            The runner has a free Project Manager slot (decision
            2026-11-17-project-manager). Only a runner with that slot sends
            it: it runs the project's one Project Manager issue there, in
            parallel with the run in its own slot. Without it, a Project
            Manager issue comes as `job`, before the team issues.
        max_parallel:
          type: integer
          minimum: 1
          maximum: 10
          description: >-
            The most team runs the runner does at once for this project, each
            in its own slot, worktree and branch (decision 2026-11-24-lanes).
            Only a runner with parallel slots sends it: the answer then has
            `jobs` instead of `job`. Its Project Manager slot, with
            `manager_idle`, is not one of them. Without it the runner does one
            run at a time and gets `job`, as before.
        held:
          type: array
          maxItems: 200
          description: The issues the runner keeps a session or clone of. Sent when it is about to tidy up, at start and while idle; the answer then has `held`.
          items:
            type: string
            maxLength: 50
        review:
          type: array
          maxItems: 200
          description: What the runner found when it last kept the Review branches current. Sending the key, also with an empty list, asks for the list; the answer then has `review`.
          items:
            $ref: '#/components/schemas/ReviewFact'

    Report:
      type: object
      description: What the runner says about itself. Always sent, always whole; it replaces the report before.
      required: [runner_version, clients, environments, errors, refused_connections]
      properties:
        runner_version:
          type: string
          maxLength: 100
        clients:
          type: array
          maxItems: 10
          description: The agent CLIs, each `name` once.
          items:
            type: object
            required: [name, version, state]
            properties:
              name:
                type: string
                maxLength: 100
                description: The agent CLI, as a team's agent names its `client`, e.g. `claude`, `codex`, `gemini`, `opencode`.
              version:
                type: [string, 'null']
                maxLength: 100
              state:
                type: string
                enum: [ready, missing_binary, missing_credential, invalid_credential]
              models:
                type: [array, 'null']
                maxItems: 500
                description: |
                  The models this client can run now, from its last successful
                  discovery (decision 2026-11-24-model-lists-from-runners): what
                  the CLI's account and credential reach, fetched at start and at
                  least every 10 minutes, without waiting a poll. Its first is the
                  model the client runs by default. A failed fetch keeps the last
                  list and its age. Leave out an id over 100 characters. Not sent
                  for `opencode`, whose models are its providers' (`provider_models`).
                  Left out or null: no list yet, so no team on this client is
                  offered. An empty list is a fetch that found none.
                items:
                  type: string
                  maxLength: 100
                  pattern: '^[A-Za-z0-9._:/-]{1,100}$'
              models_age:
                type: [integer, 'null']
                minimum: 0
                description: Seconds since `models` was fetched, at this report; required with `models`. A list older than 2400 seconds (the 10-minute refresh plus 30 minutes of grace for failed fetches) is not current.
        environments:
          type: array
          maxItems: 10
          items:
            type: string
            enum: [default, docker]
        errors:
          type: array
          maxItems: 50
          description: The errors the runner holds now.
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [repository_mismatch, not_started]
                description: '`repository_mismatch`: the project''s `repository_url` is not the runner''s repository, so it does no work. `not_started`: a run could not start, with its `issue`.'
              issue:
                type: string
                maxLength: 50
              message:
                type: string
                maxLength: 2000
        refused_connections:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The connections the runner's egress proxy refused.
        strict_hosts:
          type: boolean
          description: The runner has strict host blocking on, so it ignores a step's `allow_hosts` (decision 2026-11-17-blocked-hosts). The app then names a blocked host on the issue without asking a person about it; only the runner's local config opens one, with `cinderline allow-host add HOST:PORT [--project KEY]`. Left out, false.
        model_providers:
          type: array
          maxItems: 50
          description: The model providers the runner can use for OpenCode, `openrouter` when its key is set plus each configured one (decision 2026-11-17-local-model-providers). Left out, the runner has none. An issue whose team has an OpenCode agent on a provider not named here is not offered.
          items:
            type: string
            maxLength: 50
            pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
        free_providers:
          type: array
          maxItems: 50
          description: The runner's model providers that cost nothing per token, as whoever added the provider marked it (decision 2026-11-19-free-model-providers). Never `openrouter`. Left out, none is free. A name not in `model_providers` is ignored. The app prices an OpenCode model on a free provider at $0, in the run's prompt and its usage.
          items:
            type: string
            maxLength: 50
            pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
        provider_models:
          type: array
          maxItems: 20
          description: The models each of the runner's model providers serves, with `openrouter` (its models that take tools) when the project's key is set (decisions 2026-11-17-provider-models, 2026-11-24-model-lists-from-runners). An OpenCode model can be picked and run only while its provider's list here is current. Left out, no provider has one.
          items:
            type: object
            required: [provider, models]
            properties:
              provider:
                type: string
                maxLength: 50
                pattern: '^[a-z0-9][a-z0-9-]{0,49}$'
              models:
                type: array
                maxItems: 500
                description: Model ids without the provider, as a team's model names them after `<provider>/`, from the last successful fetch; empty when there never was one.
                items:
                  type: string
                  maxLength: 150
                  pattern: '^[A-Za-z0-9._:/-]{1,150}$'
              models_age:
                type: [integer, 'null']
                minimum: 0
                description: Seconds since `models` was fetched, as a client's `models_age`. Left out or null, the list is not current, as from a runner before decision 2026-11-24-model-lists-from-runners.

    ReviewFact:
      type: object
      required: [ref, pull_request, conflicts]
      properties:
        ref:
          type: string
          maxLength: 50
        pull_request:
          type: string
          enum: [open, merged, closed, failed, none]
          description: Where the issue's pull request stands; `failed` is an open one whose head's CI checks failed, `none` no pull request.
        conflicts:
          type: array
          maxItems: 1000
          description: The files of a merge of the base that conflicted.
          items:
            type: string
            maxLength: 1000
        checks:
          type: [array, 'null']
          maxItems: 20
          description: With `failed`, the CI checks that failed. The app writes them on the issue and sends it back to To do, a few times per issue (decision 2026-11-17-failed-ci-goes-back-to-todo). Left out or empty, `failed` sends it back only with a `reason`, and otherwise only sets a trusted team's merge status.
          items:
            $ref: '#/components/schemas/FailedCheck'
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: Why the pull request could not be merged, in the forge's own words (required approvals missing, branch protection, not mergeable, the merge API's error), or the files of a conflict the runner could not resolve. Never for a pull request a person closed. The runner clips it and removes every URL; the app removes URLs again. With a reason, the app sends the issue back to To do with it, counted with the CI fixes (decision 2026-11-25-merge-failures-go-back-to-the-agent). Left out or null, as before.

    FailedCheck:
      type: object
      description: A CI check that failed on the pull request's head. The runner clips each text to its cap.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 1000
          description: The forge's one-line summary of the check.
        url:
          type: [string, 'null']
          maxLength: 2000
          description: The check's page on the forge.
        log:
          type: [string, 'null']
          maxLength: 4000
          description: The last lines of the check's log, where the forge's API gives them.

    RefusedHost:
      type: object
      description: |
        A host the step's egress proxy refused, why, and the first request it
        refused there (decision 2026-11-25-blocked-host-urls). The proxy
        decrypts TLS only for a connection it refuses anyway, with the
        runner's own CA, reads that first request and answers `403`.
      required: [host, reason]
      properties:
        host:
          type: string
          maxLength: 260
          description: '`host:port`, the host in lower case as the allowlist writes it.'
        reason:
          type: string
          maxLength: 50
          description: |
            Why the proxy refused the host. `not_allowed`: not on any
            allowlist. `private_address`: allowed from Cinderline, but it
            resolves to a private or loopback address, which only the
            runner's local `allow-host` can open (runner decision
            2026-11-19-app-host-addresses). `strict`: allowed from
            Cinderline, but the runner has strict host blocking on.
            `runner_machine`: `localhost`, `127.*`, `[::1]` or
            `host.docker.internal`. The app reads a value it does not know as
            `not_allowed`.
          enum: [not_allowed, private_address, strict, runner_machine]
        method:
          type: [string, 'null']
          maxLength: 20
          description: The method of the first refused request. Left out with `url`.
        url:
          type: [string, 'null']
          maxLength: 2000
          description: |
            The first refused request's URL as the proxy saw it,
            `scheme://host[:port]/path`, without its query string, fragment
            or user info, cut to 2000 characters. Left out, with `method`,
            when the proxy could not decrypt the connection: a tool that pins
            certificates or ignores the injected CA. The path is text the
            agent chose: the app shows it as untrusted data.

    PollResponse:
      type: object
      required: [poll_after, review_after, project, job, stop]
      properties:
        poll_after:
          type: integer
          description: Seconds until the next poll. Shorter while a person has the project's Project Manager chat open (decision 2026-11-17-project-manager-fast-poll).
        review_after:
          type: integer
          description: Seconds between the times the runner brings the Review branches up to date and sends `review`.
        project:
          $ref: '#/components/schemas/Project'
        job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'
          description: |
            An offer, only to a poll with `idle`, and never while the project
            is archived or its runners are paused: the first of the top 20 To
            do issues of a lane (decision 2026-11-24-lanes) whose question
            hold is over, in board order, that waits for nothing, has an active
            team, and whose team's agent clients are all `ready` in the
            report, with every OpenCode agent's model provider (its model
            before the first `/`) in `model_providers`, and every agent's model
            on its client's current list in the report (`clients[].models`, or
            for OpenCode its provider's `provider_models`). The client is
            checked first, then the provider, then the model; these are the
            app's checks, by name. Nothing is claimed: the run's first `next`
            request does that. The first issue passed over because a client is
            not ready, a provider is missing or a model is not on a current
            list gets a progress line saying which. Null: no
            work. A poll without `manager_idle` gets a Project Manager issue
            here first, the same way.
        manager_job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'
          description: |
            Only when the poll had `manager_idle`; null unless it was true.
            The first To do Project Manager issue, chosen as `job` is, when
            the project has a Project Manager: its `team` is the manager as a
            team of one agent named `Project Manager`, without workers. Its
            run follows the same steps in the manager slot, next to the run
            in the job slot; it is never checked or published, and its turns
            get a `manager` token.
        jobs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Job'
          description: |
            Only when the poll had `max_parallel`; `job` is then null. Empty
            unless the poll had `idle`. A project's To do issues are in lanes,
            each a queue of its own (decision 2026-11-24-lanes): one issue per
            lane that none of the `running` issues is in, each chosen as `job`
            is, at most `max_parallel` minus the `running` issues (the Project
            Manager's left out when the poll had `manager_idle`). The lanes
            whose first issue comes first in board order get the free slots.
            Run each in its own slot as a `job`. A poll without
            `manager_idle` gets a Project Manager issue here first, in a slot
            of its own.
        stop:
          type: array
          description: The `running` issues whose turn must end now, with the outcome `stopped`. The issue is unknown, archived, Cancelled or in Backlog, or Blocked; only a Blocked issue whose latest comment is an agent's is left alone for one poll interval, because an agent that asked a person a question is ending its turn itself.
          items:
            type: string
        held:
          type: array
          description: Only when the request had `held`; one per reference, in its order.
          items:
            type: object
            required: [ref, session]
            properties:
              ref:
                type: string
              session:
                type: string
                enum: [keep, expire, drop]
                description: '`keep`: part of a run (To do, In progress, Blocked). `expire`: the runner may delete the session and clone by its own age and disk limits. `drop`: delete them now (Done, Cancelled, archived, unknown).'
        review:
          type: array
          maxItems: 200
          description: Only when the request had `review`, after its facts were applied; the active top-level Review issues with a team whose pull request is not merged, in board order. The runner keeps their branches current.
          items:
            type: object
            required: [ref, title, merge]
            properties:
              ref:
                type: string
              title:
                type: string
              merge:
                type: boolean
                description: The runner may ask the forge to merge the pull request once it is current (a trusted team).

    Project:
      type: object
      description: The token's project, always whole. The runner refuses to work when `repository_url` is not its configured repository, and reports `repository_mismatch`.
      required: [key, name, workspace, repository_url, forge, base_branch, environment, compose_file, agent_service, check_command, idle_minutes, linked_projects]
      properties:
        key:
          type: string
        name:
          type: string
        workspace:
          type: [string, 'null']
          description: The slug of the project's workspace; null while the instance has none.
        repository_url:
          type: [string, 'null']
          description: '`https://host[:port]/path` without a user name or password; the app accepts nothing else. One saved before it did may be in another form, which the runner reports as `repository_mismatch`.'
        forge:
          type: [string, 'null']
          enum: [github, gitlab, forgejo, bitbucket, null]
          description: Null, the runner tells the forge from the repository's host.
        base_branch:
          type: [string, 'null']
          description: Null, the forge's default branch.
        environment:
          type: string
          enum: [default, docker]
        compose_file:
          type: [string, 'null']
          description: For `docker`; null, the runner's default.
        agent_service:
          type: [string, 'null']
          description: For `docker`; null, the runner's default.
        check_command:
          type: [string, 'null']
          description: Run as it is by a `check` step; null, the project has none and no `check` step comes.
        idle_minutes:
          type: integer
          description: Minutes without output after which the runner stops a turn, with the outcome `idle`.
        linked_projects:
          type: array
          description: The projects whose repositories a run gets read-only.
          items:
            type: object
            required: [key, name, repository_url, base_branch]
            properties:
              key:
                type: string
              name:
                type: string
              repository_url:
                type: string
              base_branch:
                type: [string, 'null']

    Job:
      type: object
      required: [issue, team]
      properties:
        issue:
          type: object
          required: [ref, title, body]
          properties:
            ref:
              type: string
            title:
              type: string
            body:
              type: [string, 'null']
              description: Untrusted text, for the pull request.
        provider:
          type: [string, 'null']
          description: >-
            The provider from the poll's `provider_places` that the job takes
            an admission place on (decision 2026-11-25-provider-places): the
            model provider of the run's first turn when it is listed there,
            else null. One answer, `job`, `jobs` and `manager_job` together,
            names a provider at most as often as its `free`. The run is in play
            on it from now until it ends. Left out, null: the poll had no
            `provider_places`, or the app predates them.
        skills:
          type: array
          maxItems: 10
          description: |
            The skill packages attached to the issue (decision
            2026-11-26-skill-packages), for every turn of its run, sub-issues
            and workers included. Each is a public git repository pinned by a
            commit the app resolved. The runner fetches it at that commit,
            refuses any other, and mounts it read-only into the agent
            containers, where each client loads it its own way (Claude Code
            with `--plugin-dir`); never into the clone or the prompt. A runner
            with strict host blocking on loads only the packages allowed
            locally with `cinderline allow-skill`. The runner checks every
            entry against this schema before any of it becomes a path or an
            argument; one that fails is `failed`. It reports each entry's
            state in the next request's `workspace.skills`. Here, on the job,
            because a step never carries a URL. Left out or empty: none.
          items:
            $ref: '#/components/schemas/SkillPackage'
        team:
          type: object
          required: [name, max_minutes, max_turns, agents]
          properties:
            name:
              type: string
            max_minutes:
              type: integer
            max_turns:
              type: integer
            agents:
              type: array
              minItems: 1
              description: The lead first. A step names its agent by `name`.
              items:
                type: object
                required: [name, client, model, effort]
                properties:
                  name:
                    type: string
                  client:
                    type: string
                  model:
                    type: [string, 'null']
                  effort:
                    type: [string, 'null']

    SkillPackage:
      type: object
      required: [name, url, commit, path]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Unique in the workspace's catalog; the runner uses it in the mount's path and in `cinderline allow-skill`.
        url:
          type: string
          maxLength: 500
          pattern: '^https://[^/?#@\s]+(/[^?#\s]*)?$'
          description: The public repository, `https://host[:port]/path` without user info, query or fragment.
        commit:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: The commit the app resolved from the tag or branch an admin typed. The runner refuses any other.
        path:
          type: [string, 'null']
          maxLength: 200
          description: The package's root inside the repository, relative and without `..`, e.g. `plugin`; null, the repository's root.

    NextRequest:
      type: object
      required: [id, state, last, sessions, workspace]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 64
          description: A new random string per request, the same on a retry.
        state:
          type: [string, 'null']
          maxLength: 65536
          description: The `state` of the answer before, unchanged; null on the run's first request. The app keeps every state it makes within this length. One that is not of this issue's run is refused with `422`.
        last:
          oneOf:
            - $ref: '#/components/schemas/LastStep'
            - type: 'null'
          description: The step the runner just did. Null on the first request, unless the merge of the base into continued work conflicted, which is then the first `last`.
        sessions:
          type: array
          maxItems: 2
          description: The client sessions the runner can resume now.
          items:
            type: object
            required: [issue, agent, origin]
            properties:
              issue:
                type: string
                maxLength: 30
              agent:
                type: string
                maxLength: 100
              origin:
                type: string
                enum: [paused, kept, turn]
                description: The word the last `done` gave, or `turn` for a session of this run.
        workspace:
          type: object
          required: [branch, base, extra_repositories, linked_projects]
          properties:
            branch:
              type: string
              maxLength: 255
            base:
              type: string
              maxLength: 255
            extra_repositories:
              type: array
              maxItems: 50
              items:
                type: object
                required: [path, url]
                properties:
                  path:
                    type: string
                    maxLength: 255
                  url:
                    type: string
                    maxLength: 2000
            linked_projects:
              type: array
              maxItems: 50
              items:
                type: object
                required: [key, paths]
                properties:
                  key:
                    type: string
                    maxLength: 30
                  paths:
                    type: array
                    maxItems: 50
                    items:
                      type: string
                      maxLength: 255
            notes:
              type: array
              maxItems: 20
              description: Lines for the person watching, about what the runner could not prepare. The app writes those of the first request as progress lines.
              items:
                type: string
                maxLength: 1000
            skills:
              type: array
              maxItems: 10
              description: |
                One entry per skill package the job named in `skills`
                (decision 2026-11-26-skill-packages): whether the runner
                loaded it for the run's turns. Facts only; the app writes what
                a person reads. The app reads this leniently: an entry with an
                unknown `name` or `state` is ignored and never refuses the
                request. Left out or empty: the job named none.
              items:
                type: object
                required: [name, state]
                properties:
                  name:
                    type: string
                    maxLength: 64
                  state:
                    type: string
                    enum: [loaded, refused_strict, failed]
                    description: '`loaded`: fetched at its commit and mounted. `refused_strict`: the runner has strict host blocking on and no local `cinderline allow-skill` for it. `failed`: it failed the runner''s check of its fields, or its fetch, or its commit was not the one named.'

    LastStep:
      type: object
      required: [step, issue, outcome]
      description: |
        The facts of a step. `outcome` by `step`:

        | `step` | `outcome` | Other facts |
        | --- | --- | --- |
        | `run` | `finished`, `failed`, `turn_limit`, `time_limit`, `usage_limit` (the client's usage limit), `out_of_memory` (killed at the container's memory limit), `stopped` (the poll's `stop`), `idle` (the idle limit), `not_started` | `report`, `tail`, `error`, `usage`, `resets_at`, `memory_limit` |
        | `resolve` | as `run` except `usage_limit` and `out_of_memory`, and `not_verified` (the runner undid a merge it could not verify) | `report`, `tail`, `error`, `usage` |
        | `check` | `passed`, `failed`, `out_of_memory` (killed at the container's memory limit), `not_started`, `stopped` (the poll's `stop` cancelled the check) | `tail`, `error`, `report` (the checked turn's), `memory_limit` |
        | `merge` | `conflict` | `conflicts`, `commits` |
        | `publish` | `published`, `unchanged` (nothing to push), `failed` | `pull_request`, `conflicts`, `merge`, `commit`, `error`, `checks`, `reason` |
        | `stop` | `pushed`, `not_pushed` | `commit`, `error` |

        A `stop` the app did not ask for is the runner's own failure (an error
        or panic in its code, or a step kind it does not know): it pushes what
        it can and reports `stop` with `error`.

        A `check` that was `stopped` ends as a `stopped` turn: `stop`, then
        `done` with session `paused`, and no fix turn.

        A `run` with `usage_limit` ends without a retry or spending an attempt:
        `stop`, then Blocked and `done` with session `paused`. No sub-issue is
        reported failed for it. The comment names `resets_at` in UTC when
        supplied. Moving the issue back to To do continues the paused session,
        rather than following up on finished work. Deploy app support before
        releasing a runner that sends this outcome (CL-269, CLR-209).

        A `run` or `check` with `out_of_memory` went over its container's
        memory limit and was killed. The app goes on as after `failed` (a
        retry, a fix turn, or the failure) and writes a progress line that
        names `memory_limit` and how to raise it. A runner that cannot tell
        sends `failed`. Deploy app support before releasing a runner that
        sends this outcome (CL-302, CLR-217).

        A `publish` during which the poll stopped the issue before the runner
        asked the forge to merge still pushes and opens the pull request but
        does not ask the forge to merge it: it
        reports `published` with `merge` null, also when the step said
        `merge: true`. The app then reports the pull request as open and not
        merged because of the stop, and leaves the merge status as it is.

        A `publish` that waits for the merge stops waiting as soon as the pull
        request's CI checks fail: it reports `merge: failed` with the failed
        `checks`. The app then moves the issue to To do with their output
        instead of to Review, a few times per issue (decision
        2026-11-17-failed-ci-goes-back-to-todo).

        A `publish` whose pull request was not merged for a reason the runner
        read (the forge refused the merge, or a conflict it could not resolve)
        reports it in `reason`. The app then moves the issue to To do with it
        too, counted with the CI fixes (decision
        2026-11-25-merge-failures-go-back-to-the-agent).
      properties:
        step:
          type: string
          enum: [run, resolve, check, merge, publish, stop]
        issue:
          type: string
          maxLength: 30
          description: The step's issue. Only `run` and `check` can be on a sub-issue.
        agent:
          type: [string, 'null']
          maxLength: 100
        outcome:
          type: string
          enum: [finished, failed, turn_limit, time_limit, usage_limit, out_of_memory, stopped, idle, not_started, not_verified, passed, conflict, published, unchanged, pushed, not_pushed]
        resets_at:
          type: [string, 'null']
          format: date-time
          maxLength: 40
          description: 'With run outcome usage_limit: when the client says its limit resets, as an ISO-8601 timestamp with a timezone (Z or an explicit offset). Omitted or null when unknown. The app displays it explicitly in UTC; it never schedules an automatic pickup.'
        memory_limit:
          type: [integer, 'null']
          minimum: 1
          description: 'With outcome out_of_memory: the memory limit of the container that was killed, in bytes. Omitted or null when unknown.'
        error:
          type: [string, 'null']
          maxLength: 16000
        report:
          type: [string, 'null']
          maxLength: 65000
          description: The agent's last message.
        tail:
          type: [string, 'null']
          maxLength: 4000
          description: The last lines of the output.
        usage:
          oneOf:
            - $ref: '#/components/schemas/Usage'
            - type: 'null'
        conflicts:
          type: [array, 'null']
          maxItems: 1000
          items:
            type: string
            maxLength: 1000
        commits:
          type: [string, 'null']
          maxLength: 65000
          description: The branch's commits that the base lacks, one per line, for the agent that resolves the conflict.
        pull_request:
          type: [string, 'null']
          maxLength: 2000
          description: The pull request's URL.
        merge:
          type: [string, 'null']
          enum: [merged, closed, pending, failed, null]
          description: 'How the merge ended. `pending`: the runner asked the forge to merge and had not seen the merge when it moved on, at the wait''s limit or because the poll stopped the issue during the wait. Null: the runner did not ask the forge to merge, because the step did not say `merge` or the poll stopped the issue before it asked.'
        commit:
          type: [string, 'null']
          maxLength: 100
          description: The last commit of the work.
        checks:
          type: [array, 'null']
          maxItems: 20
          description: With `merge` `failed`, the CI checks that failed; left out or empty when the forge refused the merge itself.
          items:
            $ref: '#/components/schemas/FailedCheck'
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: With `published`, why the pull request could not be merged, as a Review fact's `reason`. The app sends the issue back to To do with it instead of moving it to Review (decision 2026-11-25-merge-failures-go-back-to-the-agent).
        refused:
          type: [array, 'null']
          maxItems: 20
          description: |
            With `run`, `resolve` and `check`: the hosts the step's egress
            proxy refused, one entry per `host:port` (decisions
            2026-11-17-blocked-hosts, 2026-11-25-blocked-host-urls). The app
            names the ones new to the issue in a comment and, unless the
            report said `strict_hosts`, asks a person whether the agent may
            reach them, which moves the issue to Blocked. Nothing in the app
            opens a host for every run: only the runner's local config does,
            with `cinderline allow-host add HOST:PORT [--project KEY]`. An
            entry whose `host` is not a `host:port` is ignored. Left out or
            empty, none. Replaces `refused_hosts`.
          items:
            $ref: '#/components/schemas/RefusedHost'

    Usage:
      type: object
      description: Recorded on `issue`, the run's issue or one of its sub-issues (otherwise `422`). An `agent` no longer on the team (renamed or removed during the run) is recorded under this name; it never refuses the step.
      required: [issue, agent, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens]
      properties:
        issue:
          type: string
          maxLength: 30
        agent:
          type: string
          maxLength: 100
        model:
          type: [string, 'null']
          maxLength: 100
        input_tokens:
          type: integer
          minimum: 0
          maximum: 1000000000000
        output_tokens:
          type: integer
          minimum: 0
          maximum: 1000000000000
        cache_read_tokens:
          type: integer
          minimum: 0
          maximum: 1000000000000
        cache_write_tokens:
          type: integer
          minimum: 0
          maximum: 1000000000000
        cost_usd:
          type: [number, 'null']
          minimum: 0
          maximum: 1000000
        kind:
          type: [string, 'null']
          maxLength: 50
        verdict:
          type: [string, 'null']
          enum: [passed, failed, null]
        tools:
          type: [array, 'null']
          maxItems: 200
          description: The agent CLI's tool calls in the turn, one item per tool name as the CLI names it (e.g. `Bash`, `mcp__cinderline__get_issue`), for Admin → Tool uses (decision 2026-11-24-tool-use-counts). Counts only, never arguments. Optional; omitted or null, the turn counts no tools.
          items:
            type: object
            required: [name, calls]
            properties:
              name:
                type: string
                maxLength: 100
              calls:
                type: integer
                minimum: 1
                maximum: 1000000

    NextResponse:
      type: object
      required: [state, step]
      properties:
        state:
          type: string
          description: Opaque. The runner sends it back with its next request.
        step:
          $ref: '#/components/schemas/Step'

    Step:
      description: |
        What the runner does next, a closed set by `kind`. A step never
        carries a command, a path, a docker option, an environment variable
        or a URL; its `allow_hosts` are only `host:port` pairs a person allowed. A kind the runner does not know ends the run with an
        unasked `stop` whose `error` names the runner's version.
      oneOf:
        - $ref: '#/components/schemas/RunStep'
        - $ref: '#/components/schemas/ResolveStep'
        - $ref: '#/components/schemas/CheckStep'
        - $ref: '#/components/schemas/PublishStep'
        - $ref: '#/components/schemas/StopStep'
        - $ref: '#/components/schemas/DoneStep'
      discriminator:
        propertyName: kind

    StepIssue:
      type: object
      required: [ref, title]
      properties:
        ref:
          type: string
        title:
          type: string

    RunStep:
      type: object
      description: The agent's turn on the run's issue or one of its sub-issues. The runner commits and pushes a sub-issue's work.
      required: [kind, issue, agent, session, token, prompt, attachments]
      properties:
        kind:
          const: run
        issue:
          $ref: '#/components/schemas/StepIssue'
        agent:
          type: string
        session:
          type: string
          enum: [new, resume]
        token:
          type: [string, 'null']
          description: The scoped MCP token for this turn, of kind `orchestrator`, `reader` (a sub-issue of the orchestrator's own) or `manager` (a Project Manager run); null, the agent works without Cinderline. The app deletes the run's earlier tokens when it answers, and all of them at `done`.
        prompt:
          type: string
        allow_hosts:
          $ref: '#/components/schemas/AllowHosts'
        attachments:
          type: [array, 'null']
          description: The files to put in the attachments folder, emptied first; null, leave the folder as it is.
          items:
            type: object
            required: [issue, id, name]
            properties:
              issue:
                type: string
              id:
                type: integer
              name:
                type: string
                description: One safe, unique file name.
        reason:
          $ref: '#/components/schemas/Reason'

    ResolveStep:
      type: object
      description: The agent resolves the conflict the runner just reported; the runner verifies the merge and undoes it otherwise.
      required: [kind, agent, session, token, prompt]
      properties:
        kind:
          const: resolve
        agent:
          type: string
        session:
          type: string
          enum: [new, resume]
        token:
          type: [string, 'null']
        prompt:
          type: string
        allow_hosts:
          $ref: '#/components/schemas/AllowHosts'
        reason:
          $ref: '#/components/schemas/Reason'

    CheckStep:
      type: object
      description: The runner commits, pushes and runs the project's `check_command`.
      required: [kind, issue]
      properties:
        kind:
          const: check
        issue:
          $ref: '#/components/schemas/StepIssue'
        allow_hosts:
          $ref: '#/components/schemas/AllowHosts'
        reason:
          $ref: '#/components/schemas/Reason'

    PublishStep:
      type: object
      description: The runner commits, merges the base, pushes and opens or finds the pull request. Its report is answered with `done`.
      required: [kind, resolve_conflicts, merge]
      properties:
        kind:
          const: publish
        resolve_conflicts:
          type: boolean
          description: A conflict of the base merge goes to `next` first, as a `merge` step, instead of being pushed.
        merge:
          type: boolean
          description: Ask the forge to merge the pull request and wait for it (a trusted team).
        reason:
          $ref: '#/components/schemas/Reason'

    StopStep:
      type: object
      description: The runner commits and pushes what the clone holds. Its report is answered with `done`.
      required: [kind]
      properties:
        kind:
          const: stop
        reason:
          $ref: '#/components/schemas/Reason'

    DoneStep:
      type: object
      description: The run ends. The runner keeps the lead's session under the word given.
      required: [kind, session]
      properties:
        kind:
          const: done
        session:
          type: string
          enum: [paused, kept]
          description: '`paused`: the run continues in this session (it waits for a person, reached its budget, was stopped, or is a team between its rounds). `kept`: for a follow-up.'
        reason:
          $ref: '#/components/schemas/Reason'

    AllowHosts:
      type: array
      description: |
        The `host:port` pairs a person allowed for this issue's runs by
        answering "Yes, this run" (decision 2026-11-17-blocked-hosts), sub-issues
        included. The runner adds them to this step's proxy allowlist, unless
        it has strict host blocking on, and never opens `localhost`, a loopback
        address or `host.docker.internal` through them. They never open a
        host for every run: only the runner's local config does, with
        `cinderline allow-host add HOST:PORT [--project KEY]`, which without
        `--project` applies to all current and future projects. Left out, none.
      items:
        type: string

    Reason:
      type: string
      description: Why the app chose the step. For the runner's log only.
