components:
  securitySchemes:
    runnerToken:
      type: http
      scheme: bearer
      description: A Sanctum personal access token of the project's runner user with the `runner` ability.
  parameters:
    RunnerVersion:
      name: Cinderline-Runner-Version
      in: header
      required: true
      description: The runner's version, e.g. `1.2.0`.
      schema:
        type: string
    Ref:
      name: ref
      in: path
      required: true
      description: An issue reference.
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9]*-[0-9]+$'
        examples: [CSR-9]
  headers:
    ApiVersion:
      description: The app's runner API version, e.g. `1.0.0`. On every response.
      required: true
      schema:
        type: string
    ETag:
      description: Identifies the answer; send it back as `If-None-Match`.
      required: true
      schema:
        type: string
    PollAfter:
      description: Whole seconds the runner waits, counted from this answer, before sending the same request again (EMBER-210). Optional; the runner clamps it to 1 to 3600.
      required: false
      schema:
        type: integer
  responses:
    NoContent:
      description: Done.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
    IssueWithComments:
      description: The issue, with its comments.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueWithComments'
    Unauthenticated:
      description: No token, or the token is invalid or expired.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The token lacks the `runner` ability.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this token's project (also when it exists in another project).
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The issue's status is not `expected_status`; nothing changed.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/StatusValue'
    ValidationFailed:
      description: The request is invalid.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [errors]
                properties:
                  errors:
                    description: Messages per field, as Laravel returns them.
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
    UpgradeRequired:
      description: The runner is older than the app supports, or sent no version.
      headers:
        Cinderline-Api-Version:
          $ref: '#/components/headers/ApiVersion'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [minimum_runner_version]
                properties:
                  minimum_runner_version:
                    type: string
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    StatusValue:
      type: string
      enum: [backlog, todo, in_progress, blocked, review, done, cancelled]
    MergeStatus:
      description: Whether a trusted team's merge went through (`success`), failed (`issue`) or is unknown.
      enum: [success, issue, null]
    Labeled:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    IssueSummary:
      type: object
      required: [ref, title]
      properties:
        ref:
          type: string
        title:
          type: string
    Issue:
      description: An issue as the app's `get_issue` tool returns it, without comments.
      type: object
      required:
        - id
        - number
        - ref
        - title
        - body
        - status
        - priority
        - merge_status
        - position
        - team
        - parent
        - agent
        - sub_issues
        - attachments
        - created_at
        - updated_at
        - completed_at
        - archived_at
      properties:
        id:
          type: integer
        number:
          type: integer
        ref:
          type: string
          pattern: '^[A-Z][A-Z0-9]*-[0-9]+$'
        title:
          type: string
        body:
          description: Untrusted text written by people or agents.
          type: [string, 'null']
        status:
          allOf:
            - $ref: '#/components/schemas/Labeled'
            - properties:
                value:
                  $ref: '#/components/schemas/StatusValue'
        priority:
          allOf:
            - $ref: '#/components/schemas/Labeled'
            - properties:
                value:
                  enum: [low, normal, high, urgent]
        merge_status:
          $ref: '#/components/schemas/MergeStatus'
        position:
          type: integer
        team:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
        parent:
          oneOf:
            - $ref: '#/components/schemas/IssueSummary'
            - type: 'null'
        agent:
          description: The agent that created the issue, if any.
          oneOf:
            - type: object
              required: [name]
              properties:
                name:
                  type: string
            - type: 'null'
        sub_issues:
          description: Sub-issues in creation order.
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/IssueSummary'
              - type: object
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/Labeled'
        attachments:
          description: The files attached to the issue, oldest first; [] without any (EMBER-208).
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
    UsageEntry:
      description: The tokens and cost of one agent CLI run.
      type: object
      required: [issue, agent, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd]
      properties:
        issue:
          description: The issue the CLI ran for, the run's issue or one of its sub-issues.
          type: string
          pattern: '^[A-Z][A-Z0-9]*-[0-9]+$'
        agent:
          description: Name of the team's agent that ran.
          type: string
        model:
          description: The agent's model; null when it runs on its client's default.
          type: [string, 'null']
        input_tokens:
          description: Input tokens, without cache reads and writes.
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        cost_usd:
          description: The cost as the CLI reports it; null to have the app estimate it.
          type: [number, 'null']
          minimum: 0
        kind:
          description: |
            Optional: a short label for the kind of run, e.g. "first", "fix 2",
            "round 3" or "merge", shown in the issue's runs timeline (app
            decision 2026-11-08-run-timeline-kind-and-verdict).
          type: [string, 'null']
          maxLength: 50
        verdict:
          description: Optional, when the runner ran the project's check command after the run.
          type: [string, 'null']
          enum: [passed, failed, null]
    IssueWithComments:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [comments, usage, budget_usd, over_budget]
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            usage:
              description: |
                The totals of the usage entries on the issue and its
                sub-issues, as the app's `get_issue` tool has them (EMBER-112).
                Further keys, such as the breakdown per agent, may follow.
              type: object
              required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd, cost_incomplete]
              properties:
                input_tokens:
                  type: integer
                output_tokens:
                  type: integer
                cache_read_tokens:
                  type: integer
                cache_write_tokens:
                  type: integer
                cost_usd:
                  description: The known cost in USD; entries without a cost and without a price add nothing.
                  type: number
                cost_incomplete:
                  description: Some entry's cost is unknown.
                  type: boolean
            budget_usd:
              description: The cost budget in effect, the issue's or else its team's; a sub-issue's is its parent's. Null when there is none.
              type: [number, 'null']
            over_budget:
              description: |
                Whether the known cost reached `budget_usd`; for a sub-issue,
                its parent's total. The runner starts no agent CLI run on an
                issue over its budget (EMBER-112).
              type: boolean
    Attachment:
      description: A file attached to an issue; `url` downloads it through this API (EMBER-208).
      type: object
      required: [id, name, size, mime_type, url]
      properties:
        id:
          type: integer
        name:
          description: The original file name, untrusted text from the uploader.
          type: string
        size:
          description: Bytes.
          type: integer
          minimum: 0
        mime_type:
          type: string
        url:
          description: The absolute URL of `GET /issues/{ref}/attachments/{id}` for this file.
          type: string
          format: uri
    Comment:
      type: object
      required: [id, body, author, created_at]
      properties:
        id:
          type: integer
        body:
          description: Untrusted text written by people or agents.
          type: string
        author:
          description: The user who wrote it; `agent` is set when an agent wrote it through its token.
          type: object
          required: [name, agent]
          properties:
            name:
              type: string
            agent:
              type: [string, 'null']
        created_at:
          type: string
          format: date-time
    MessageBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
    Project:
      type: object
      required: [key, name, repository_url, forge, base_branch, environment, linked_projects]
      properties:
        key:
          type: string
          examples: [CSR]
        name:
          type: string
        repository_url:
          type: string
          format: uri
        forge:
          description: The forge that hosts the repository.
          type: string
          examples: [github, forgejo]
        base_branch:
          type: string
          examples: [main]
        environment:
          description: Where runs happen; set by admins in the app, never from issue text (0098).
          enum: [default, docker, existing]
        compose_file:
          description: For environment docker, the compose file's path in the repository, read from the base branch only; set by admins. Null or absent means the default (decision 2026-11-08-m6-environments point 1).
          type: [string, 'null']
          default: .cinderline/compose.yml
        agent_service:
          description: For environment docker, the compose file's service the agents run in; set by admins. Null or absent means the default.
          type: [string, 'null']
          default: agent
        check_command:
          description: The project's check command, set by admins in the project settings, never from issue text. The runner runs it through `sh -c` in the issue's clone after each agent run that changes code, and sends a failure back to the agent's session at most three times (CSR-80). Null or absent means no check, and the orchestrator is told the reports are unverified.
          type: [string, 'null']
        idle_minutes:
          description: An agent run that prints nothing this many minutes is stalled; the runner stops it, pushes its work and moves the issue to Blocked with a note. Set per project by admins. Null or absent means the runner's default (CSR-159).
          type: [integer, 'null']
          minimum: 1
          default: 20
        workspace:
          description: The workspace the project belongs to (EMBER-159); project keys are unique per workspace, not per instance. The runner names a project's local config entry, Docker volumes and labels by URL, workspace slug and key (CSR-97). Null or absent, from an app before workspaces, means the slug `default`.
          type: [object, 'null']
          required: [id, slug]
          properties:
            id:
              type: integer
            slug:
              description: Letters, digits, `-` and `_`, starting with a letter or digit; it ends up in Docker names.
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
              examples: [acme]
        long_poll:
          description: Whether the app can hold `GET /work` open (it runs on FrankenPHP or Octane). Only then does the runner send `wait`. False or absent means short polls with `If-None-Match` (CSR-93).
          type: boolean
          default: false
        linked_projects:
          description: The projects this project's agents may reach, one direction per link. Empty when there are none.
          type: array
          items:
            type: object
            required: [key, name, repository_url, base_branch]
            properties:
              key:
                type: string
                examples: [EMBER]
              name:
                type: string
              repository_url:
                type: string
                format: uri
              base_branch:
                type: string
                examples: [main]
    Team:
      type: object
      required: [id, name, max_minutes, trusted, max_sub_issues, ponytail, agents]
      properties:
        id:
          type: integer
        name:
          type: string
        max_minutes:
          description: The longest an agent run of this team may take.
          type: integer
          minimum: 1
        max_turns:
          description: The most turns an agent run of this team may take (Claude Code's --max-turns, OpenCode's steps). The runner uses 50 when it is missing (decision 2026-11-07-team-max-turns).
          type: integer
          minimum: 1
        trusted:
          description: Whether the runner requests the merge after the pull request (2026-11-04-runner-waits-for-merge).
          type: boolean
        max_sub_issues:
          description: The most sub-issues one issue may get, for the orchestrator's prompt (decision 0122).
          type: integer
          minimum: 0
        ponytail:
          description: Whether the team's Claude Code runs load the ponytail plugin (2026-11-03-per-team-ponytail-plugin).
          type: boolean
        generic_runs:
          description: Whether the team's runs are generic (app decision 2026-11-05-generic-runs-and-agent-proposals) - the orchestrator runs alone, acts through Cinderline's MCP tools, changes no files and gets no pull request; the issue moves to review with the run's report. The runner treats a missing value as false, a coding run.
          type: boolean
        agents:
          type: array
          items:
            type: object
            required: [name, role, client, model, effort, instructions, description, price]
            properties:
              name:
                type: string
              role:
                description: The agent's part in the team, e.g. orchestrator, worker, merge resolver.
                type: string
              client:
                description: The agent CLI, e.g. `claude` or `opencode`.
                type: string
              model:
                type: [string, 'null']
              effort:
                description: The slot's effort level from its client's list (Claude Code's --effort, OpenCode's --variant, Codex's model_reasoning_effort); null is the client's default (app decision 2026-11-06-effort-per-team-slot).
                type: [string, 'null']
              instructions:
                description: The agent's own instructions, first in its prompt (decision 2026-11-06-prompts).
                type: [string, 'null']
              description:
                description: What the agent is good at, listed in the orchestrator's prompt.
                type: [string, 'null']
              price:
                description: The model's price in USD per million tokens, listed in the orchestrator's prompt; null when unknown.
                type: [object, 'null']
                required: [input, output]
                properties:
                  input:
                    type: number
                  output:
                    type: number
    Report:
      type: object
      required: [runner_version, clients, environments]
      properties:
        runner_version:
          type: string
        clients:
          type: array
          items:
            type: object
            required: [name, version, state]
            properties:
              name:
                type: string
                examples: [claude]
              version:
                type: [string, 'null']
              state:
                description: Whether the client can run (EMBER-40).
                enum: [ready, missing_binary, missing_credential, invalid_credential]
        environments:
          description: The environments this runner can serve.
          type: array
          items:
            enum: [default, docker, existing]
        errors:
          description: Errors the runner holds in memory now (decision 2026-11-08-errors-reach-cinderline); sent only when changed, at most once per heartbeat. Messages never carry tokens.
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [repository_mismatch, missing_key, unsupported_client, poll_failed]
              message:
                type: string
              issue:
                description: An issue ref, set only for missing_key and unsupported_client.
                type: string
        refused_connections:
          description: Connections the egress proxy of this project's agent runs refused since the runner started (CSR-63); left out while 0.
          type: integer
          minimum: 1
    AgentTokenKind:
      description: |
        What an agent token may do, limited to the issue it was made for:

        - `orchestrator`: the agent tools `get_issue`,
          `list_comments`, `add_comment`, `create_issue` (sub-issues of the
          issue only), `update_issue` (within the issue tree), `ask_person`
          and `reply_person`.
        - `reader`: for the orchestrator's own sub-issue, only `get_issue` and
          `list_comments`.

        Outside the issue tree, a token reaches only the issues of projects
        its project links to, with the tools listed here: in a linked project
        an `orchestrator` token may use `get_issue`,
        `list_comments`, `list_issues`, `search`, `add_comment`,
        `create_issue` (top-level only) and `update_issue` (title, body,
        priority, status; the rule for `done` unchanged). The `reader` kind
        reaches no linked project. No kind has the `runner` ability
        (decision 2026-11-11-project-links).
      enum: [orchestrator, reader]
    NextRequest:
      description: What the runner just did and the facts only it knows, for `nextStep`.
      type: object
      required: [context, state, last, sessions, workspace]
      properties:
        context:
          description: '`run`: a run of `ref`, which is In progress. `review`: keeping the branch of `ref`, in Review, current with the base.'
          type: string
          enum: [run, review]
        state:
          description: The `state` of the previous answer in this run, unchanged; null on the first call and after the runner lost it.
          type: [string, 'null']
          maxLength: 8192
        last:
          description: The step the runner just did; null on the first call of a run, unless the base merge before it conflicted.
          oneOf:
            - $ref: '#/components/schemas/LastStep'
            - type: 'null'
        sessions:
          description: |
            The client sessions the runner can resume now: the lead agent's
            (from a paused or kept note, or this run's last turn) and the last
            turn's when that is another agent's. The runner lists a note's
            session only when it can resume it: same client, clone still there,
            same kind of run.
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ResumableSession'
        workspace:
          $ref: '#/components/schemas/RunWorkspace'
    ResumableSession:
      type: object
      required: [issue, agent, origin]
      properties:
        issue:
          type: string
          pattern: '^[A-Z][A-Z0-9]*-[0-9]+(\.[0-9]+)*$'
        agent:
          description: Name of the team's agent whose session it is.
          type: string
        origin:
          description: '`paused`: a run that paused for a person, a budget stop or a halt. `kept`: a finished run kept for a follow-up (CSR-145). `turn`: a turn of this run.'
          type: string
          enum: [paused, kept, turn]
    RunWorkspace:
      description: Facts about the run's clone and mounts for the prompts. In Review the lists are empty.
      type: object
      required: [branch, base, extra_repositories, linked_projects]
      properties:
        branch:
          type: string
          examples: [cinderline/CSR-200]
        base:
          type: string
          examples: [main]
        extra_repositories:
          description: The project's extra repositories this run fetched, read-only in the agent's container (CSR-160). The URL has no user info.
          type: array
          items:
            type: object
            required: [path, url]
            properties:
              path:
                type: string
                examples: [/extra/design-system]
              url:
                type: string
        linked_projects:
          description: |
            Every linked project of `getProject`, with the folders under
            `/linked` this run fetched of its repositories; `paths` is empty
            when none could be fetched or the project is not added on this
            runner (CSR-161).
          type: array
          items:
            type: object
            required: [key, paths]
            properties:
              key:
                type: string
              paths:
                type: array
                items:
                  type: string
                  examples: [EMBER/ember]
    LastStep:
      description: |
        The step the runner just did and how it ended. `outcome` by `step`:

        - `run` and `resolve`: `finished`, `failed`, `turn_limit` (the
          client's turn limit), `time_limit` (the team's `max_minutes`),
          `stopped` (the runner stopped the turn because a person moved the
          issue to Blocked, Cancelled or Backlog, or it printed nothing for the
          project's `idle_minutes`; it has pushed the work and posted its note,
          CSR-159), `not_started` (it could not start the turn, for example an
          attachment did not download or the agent is not on the team).
          After a `resolve`, `finished` means the runner verified the merge and
          `not_verified` that it undid it.
        - `check`: `passed`, `failed`, `not_started` (the check could not run).
        - `merge`: `conflict`, the base merge the runner does itself (see
          `nextStep`) conflicted and was aborted.
      type: object
      required: [id, step, issue, agent, outcome, error, report, tail, usage, conflicts, commits]
      properties:
        id:
          description: Made by the runner, unique for each step it did; a retried call sends the same one.
          type: string
          maxLength: 64
        step:
          type: string
          enum: [run, resolve, check, merge]
        issue:
          description: The issue or sub-issue of the step.
          type: string
          pattern: '^[A-Z][A-Z0-9]*-[0-9]+(\.[0-9]+)*$'
        agent:
          description: The team's agent that ran, or whose work a `check` checked; null for `merge`.
          type: [string, 'null']
        outcome:
          type: string
          enum: [finished, failed, turn_limit, time_limit, stopped, not_started, not_verified, passed, conflict]
        error:
          description: The runner's error for `failed`, `time_limit`, `stopped`, `not_started` and `not_verified`; else null.
          type: [string, 'null']
        report:
          description: The agent's final message, untrusted. After a `check`, the latest report of the runs on that issue. Null when there is none.
          type: [string, 'null']
        tail:
          description: The last lines of the output of a failed turn or check, at most 4,000 characters, untrusted; else null.
          type: [string, 'null']
          maxLength: 4000
        usage:
          description: The turn's tokens and cost, which the app stores as `reportUsage` does; null when the step ran no agent or the client printed none.
          oneOf:
            - $ref: '#/components/schemas/UsageEntry'
            - type: 'null'
        conflicts:
          description: For `conflict`, the conflicting files; else empty. Repository data, untrusted.
          type: array
          items:
            type: string
        commits:
          description: For `conflict`, `git log --oneline origin/<base>..HEAD`; else null. Repository data, untrusted.
          type: [string, 'null']
    NextResponse:
      type: object
      required: [state, step]
      properties:
        state:
          description: Opaque and signed; send it back unchanged with the next call of this run.
          type: string
          maxLength: 8192
        step:
          $ref: '#/components/schemas/Step'
    Step:
      description: The next step; see `nextStep` for what the runner does with each kind.
      oneOf:
        - $ref: '#/components/schemas/RunStep'
        - $ref: '#/components/schemas/ResolveStep'
        - $ref: '#/components/schemas/CheckStep'
        - $ref: '#/components/schemas/PublishStep'
        - $ref: '#/components/schemas/FinishStep'
        - $ref: '#/components/schemas/PauseStep'
        - $ref: '#/components/schemas/FailStep'
        - $ref: '#/components/schemas/NoneStep'
      discriminator:
        propertyName: kind
        mapping:
          run: '#/components/schemas/RunStep'
          resolve: '#/components/schemas/ResolveStep'
          check: '#/components/schemas/CheckStep'
          publish: '#/components/schemas/PublishStep'
          finish: '#/components/schemas/FinishStep'
          pause: '#/components/schemas/PauseStep'
          fail: '#/components/schemas/FailStep'
          none: '#/components/schemas/NoneStep'
    StepIssue:
      description: The issue or sub-issue of a step; the title is for the runner's commit message.
      type: object
      required: [ref, title]
      properties:
        ref:
          type: string
          pattern: '^[A-Z][A-Z0-9]*-[0-9]+(\.[0-9]+)*$'
        title:
          type: string
    AgentTurn:
      description: What `run` and `resolve` share.
      type: object
      required: [agent, session, token, prompt, progress]
      properties:
        agent:
          description: Name of one of the team's agents; its client, model and effort come from `getTeam`.
          type: string
        session:
          description: '`resume` continues the session `sessions` listed for this issue and agent; without one the runner stops the run with an error.'
          type: string
          enum: [new, resume]
        token:
          description: The kind of agent token the runner creates for the step's issue, or `none` for a turn without Cinderline access.
          type: string
          enum: [orchestrator, reader, none]
        prompt:
          description: The whole prompt, in the order of decision 2026-11-06-prompts. Untrusted texts come last, marked as data.
          type: string
          minLength: 1
        progress:
          description: The progress line the app wrote on `ref` for this step, for the runner's log; null when it wrote none.
          type: [string, 'null']
    RunStep:
      allOf:
        - $ref: '#/components/schemas/AgentTurn'
        - type: object
          required: [kind, issue, attachments]
          properties:
            kind:
              const: run
            issue:
              $ref: '#/components/schemas/StepIssue'
            attachments:
              description: |
                The files the agent gets under `/attachments`: the runner
                empties the folder and downloads each with
                `downloadAttachment`. Null leaves the folder as it is, for a
                resumed turn. A name must be one safe file name, unique without
                regard to case, else the step does not start.
              type: [array, 'null']
              items:
                type: object
                required: [issue, id, name]
                properties:
                  issue:
                    type: string
                    pattern: '^[A-Z][A-Z0-9]*-[0-9]+(\.[0-9]+)*$'
                  id:
                    type: integer
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
    ResolveStep:
      description: An agent turn on the base merge that `last` reported as a conflict, always on `ref`.
      allOf:
        - $ref: '#/components/schemas/AgentTurn'
        - type: object
          required: [kind]
          properties:
            kind:
              const: resolve
    CheckStep:
      type: object
      required: [kind, issue, progress]
      properties:
        kind:
          const: check
        issue:
          $ref: '#/components/schemas/StepIssue'
        progress:
          type: [string, 'null']
    PublishStep:
      type: object
      required: [kind, resolve_conflicts, report_head, report_foot]
      properties:
        kind:
          const: publish
        resolve_conflicts:
          description: Whether a conflict in the base merge ends the step and is reported with `nextStep`, or is pushed as it is.
          type: boolean
        report_head:
          description: Text above the runner's finish report, such as the check verdict; null for none.
          type: [string, 'null']
        report_foot:
          description: Text below it, such as the note that a person's comments were not read; null for none.
          type: [string, 'null']
    FinishStep:
      type: object
      required: [kind, comment]
      properties:
        kind:
          const: finish
        comment:
          type: string
          minLength: 1
    PauseStep:
      type: object
      required: [kind, reason, block, comment]
      properties:
        kind:
          const: pause
        reason:
          description: For the runner's log; known values are `waiting` (for a person or other issues), `budget` and `stopped`. Another value is logged as it is.
          type: string
        block:
          description: Commit and push the work, then move `ref` from In progress to Blocked.
          type: boolean
        comment:
          type: [string, 'null']
    FailStep:
      type: object
      required: [kind, reason, comment]
      properties:
        kind:
          const: fail
        reason:
          description: For the runner's log; known values are `attempts_failed` and `no_sub_issue_started`. Another value is logged as it is.
          type: string
        comment:
          type: string
          minLength: 1
    NoneStep:
      type: object
      required: [kind]
      properties:
        kind:
          const: none
