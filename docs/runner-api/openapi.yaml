openapi: 3.1.0
info:
  title: Cinderline runner API
  version: 1.1.0
  license:
    name: Functional Source License, Version 1.1, ALv2 Future License
    identifier: FSL-1.1-ALv2
  description: |
    The REST API a runner uses to take issues from a Cinderline instance, run
    agent teams on them and report back (plan M1, decision 2026-11-05-runner-rewrite-details).
    This file is authored in the runner repository and mirrored into the app
    repository, where a test checks it against the routes.

    **Authentication.** Every route needs a Sanctum personal access token as a
    bearer token that carries the `runner` ability. The token belongs to the
    runner user of exactly one project (0099), and every route is limited to
    that project by the app's policies:

    - no or an invalid token: `401`;
    - a valid token without the `runner` ability (a person's token, a scoped
      agent token): `403`;
    - an issue, team or run of another project, or one that does not exist:
      `404`, so a token never learns what exists outside its project.

    **Versions (EMBER-44).** Every request carries `Cinderline-Runner-Version`.
    Any route may answer `426` with the minimum runner version. Every response,
    including errors, `304` and `426`, carries `Cinderline-Api-Version`.

    **Polling intervals (EMBER-210, CSR-174).** The answers to the requests the
    runner repeats on a timer (`getWork`, `heartbeat`, and `listIssues` with a
    `purpose`) may carry `Cinderline-Poll-After`: whole seconds to wait,
    counted from that answer, before sending the same request again. The
    runner clamps it to 1 to 3600 seconds and adds a few seconds of jitter.
    Without it the runner keeps its own defaults. Errors keep the runner's
    own backoff.

    **Unavailable (CSR-93).** Any route may answer `429` or `503`, for example
    under a per-token rate limit or during a deploy, with `Retry-After` in
    seconds or as an HTTP date. The runner then sends no request at all with
    that token until it has passed (capped at an hour). Without it, on any
    `5xx` or no answer, the runner backs off exponentially from a second to a
    minute, and reports `poll_failed` only after two minutes of failures.

    **Issue references** such as `CSR-9` identify issues in paths.
servers:
  - url: '{instance}/api/runner/v1'
    variables:
      instance:
        default: https://cinderline.example.com
        description: Base URL of the Cinderline instance.
security:
  - runnerToken: []
paths:
  /project:
    get:
      operationId: getProject
      summary: The project this token belongs to.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '200':
          description: The project.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /work:
    get:
      operationId: getWork
      summary: Poll for the next To do issue with a team.
      description: |
        Answers as soon as the project has a To do issue with a team, or after
        `wait` seconds; it may answer at once. The answer is the first such
        issue in board order, or `issue: null` when there is none; both are
        `200` with an `ETag`. When the request's `If-None-Match` matches the
        current answer, the app keeps waiting until the answer changes or
        `wait` runs out, and then answers `304` without a body. The runner
        sends `wait` only when the project's `long_poll` is true, and never
        relies on the request being held: it paces its own polls between
        answers that bring no work, counted from the answer.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
        - name: wait
          in: query
          description: The most seconds the app may hold the request waiting for work; it may answer sooner, also at once.
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 25
        - name: If-None-Match
          in: header
          description: The `ETag` of the previous answer.
          schema:
            type: string
      responses:
        '200':
          description: The first To do issue with a team, or none.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cinderline-Poll-After:
              $ref: '#/components/headers/PollAfter'
          content:
            application/json:
              schema:
                type: object
                required: [issue]
                properties:
                  issue:
                    oneOf:
                      - $ref: '#/components/schemas/Issue'
                      - type: 'null'
        '304':
          description: The answer is unchanged since `If-None-Match`.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cinderline-Poll-After:
              $ref: '#/components/headers/PollAfter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues:
    get:
      operationId: listIssues
      summary: The project's issues with a team in the given statuses.
      description: |
        Used for recovery (In progress at start), keeping Review branches
        current and checking merges (Review). Archived issues are left out.

        Returns at most 200 issues, in board order; there is no paging. The
        runner logs a warning when a list comes back with 200 issues and handles
        only those.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
        - name: status
          in: query
          required: true
          description: One or more statuses, comma-separated, e.g. `in_progress,review`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/StatusValue'
        - name: purpose
          in: query
          description: |
            Sent with `status=review` by the runner's timed checks: `review`
            keeps Review branches current, `merge` checks merges. It tells the
            app which check asks, so it can answer each with its own
            `Cinderline-Poll-After`. Requests without it are not repeated on a
            timer.
          schema:
            type: string
            enum: [review, merge]
      responses:
        '200':
          description: At most 200 issues, the first in board order, without their comments.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Cinderline-Poll-After:
              $ref: '#/components/headers/PollAfter'
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues/{ref}:
    parameters:
      - $ref: '#/components/parameters/Ref'
    get:
      operationId: getIssue
      summary: One issue with its comments.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '200':
          $ref: '#/components/responses/IssueWithComments'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
    patch:
      operationId: updateIssue
      summary: Change an issue's status or merge status.
      description: |
        A `status` change needs `expected_status`; when the issue's current
        status differs the app answers `409` and changes nothing. At least one
        of `status` and `merge_status` is required.

        The runner token may not move a top-level issue to `done`: that is `403`
        "This token may not move issues to done." Finished work goes to
        `review`. A sub-issue may be moved to `done`, because its orchestrator
        reviews it (decision 2026-11-08-runner-tokens-without-done).
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  $ref: '#/components/schemas/StatusValue'
                expected_status:
                  $ref: '#/components/schemas/StatusValue'
                merge_status:
                  $ref: '#/components/schemas/MergeStatus'
              dependentRequired:
                status: [expected_status]
      responses:
        '200':
          $ref: '#/components/responses/IssueWithComments'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues/{ref}/claim:
    parameters:
      - $ref: '#/components/parameters/Ref'
    post:
      operationId: claimIssue
      summary: Move an issue to In progress to run it.
      description: |
        Moves the issue from `expected_status` to `in_progress`. `409` when its
        status is no longer `expected_status`, for example because someone
        else took it.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_status]
              properties:
                expected_status:
                  $ref: '#/components/schemas/StatusValue'
      responses:
        '200':
          $ref: '#/components/responses/IssueWithComments'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues/{ref}/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Ref'
      - name: id
        in: path
        required: true
        description: An attachment ID from the issue's `attachments`.
        schema:
          type: integer
    get:
      operationId: downloadAttachment
      summary: One of the issue's files, as listed in its attachments (EMBER-208).
      description: |
        The bytes as uploaded, with the file's `mime_type` as Content-Type and
        its `name` in Content-Disposition; `X-Content-Type-Options: nosniff`
        is set, so take the declared type as it is. The runner puts the files
        in the run's container. An attachment of another issue, or of an issue
        outside the token's project, is 404.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '200':
          description: The file.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues/{ref}/comments:
    parameters:
      - $ref: '#/components/parameters/Ref'
    get:
      operationId: listComments
      summary: An issue's latest comments, at most 200, oldest first.
      description: |
        Returns at most 200 comments, oldest first. With after, the oldest 200
        comments whose ID is greater than after; without it, the newest 200.
        The runner keeps a comment cursor and asks with after=<cursor>, so the
        cap hides a newer comment only when more than 200 arrived since the
        cursor (decision 2026-11-08-comment-cursor).
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
        - name: after
          in: query
          required: false
          description: A comment ID; only comments with a greater ID are returned.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The comments.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
    post:
      operationId: addComment
      summary: Add a comment as the runner user.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageBody'
      responses:
        '201':
          description: The new comment.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /issues/{ref}/progress:
    parameters:
      - $ref: '#/components/parameters/Ref'
    post:
      operationId: addProgress
      summary: Report what a run is doing now.
      description: A short progress message shown on the issue while it runs.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageBody'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTeam
      summary: A team of the project, with its agents.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '200':
          description: The team.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /report:
    put:
      operationId: putReport
      summary: Replace the runner's report.
      description: |
        Stored per token, as columns on `personal_access_tokens` (D5, EMBER-41),
        and shown in the app (EMBER-42). Each call replaces the previous report.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /heartbeat:
    post:
      operationId: heartbeat
      summary: Tell the app the runner is alive (EMBER-43).
      description: Sent every `Cinderline-Poll-After` seconds, else every 60, also while a long run is in flight. No body.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '204':
          description: Done.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Cinderline-Poll-After:
              $ref: '#/components/headers/PollAfter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /runs/{ref}/agent-token:
    parameters:
      - $ref: '#/components/parameters/Ref'
    post:
      operationId: createAgentToken
      summary: Create a short-lived token for one agent run on this issue.
      description: |
        The token an agent uses for the Cinderline MCP tools. It is scoped to
        the issue `ref` and its tree; outside the issue tree, a token reaches
        only the issues of projects its project links to, with the tools
        listed in `AgentTokenKind`. See
        `AgentTokenKind` for what each kind may do. The token is named after
        the issue's team and the agent, so the app detects the agent from it
        (0045). It expires after the team's `max_minutes` plus a margin. The
        runner deletes it when the run ends. Workers and the Merge Resolver get
        no Cinderline access and so no token (0122).

        A new token for the same issue and agent replaces the previous one.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, agent]
              properties:
                kind:
                  $ref: '#/components/schemas/AgentTokenKind'
                agent:
                  type: string
                  description: Name of the team's agent that runs with the token.
      responses:
        '201':
          description: The plain token, shown only once.
          headers:
            Cinderline-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
    delete:
      operationId: deleteAgentTokens
      summary: Delete the issue's agent tokens when its run ends.
      description: Deletes every agent token of the issue `ref`. Also `204` when there is none.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /runs/{ref}/usage:
    parameters:
      - $ref: '#/components/parameters/Ref'
    post:
      operationId: reportUsage
      summary: Record the usage of a run's agent CLI runs, in one call when the run ends.
      description: |
        The tokens and USD cost of every agent CLI run of one run on the
        top-level issue `ref`, collected by the runner and sent in one call
        when the run ends, also when it failed, paused or was stopped
        (EMBER-112; batched per app decision
        2026-11-07-shared-tables-and-scalability, point 16, EMBER-161).

        Each entry becomes one `usage` activity entry on its `issue`, which is
        `ref` or one of its sub-issues, under the team's agent named, as
        `RecordUsage` does for the MCP tool `report_usage`: labelled
        "<team> / <agent>" like an agent token, with `model`. Without
        `cost_usd` the app estimates the cost from the model's price.
        `422` when an entry's issue is not `ref` or one of its sub-issues, or
        its agent is not one of the team's.
      parameters:
        - $ref: '#/components/parameters/RunnerVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/UsageEntry'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
  /runs/{ref}/next:
    parameters:
      - $ref: '#/components/parameters/Ref'
    post:
      operationId: nextStep
      summary: Report the step the runner just did and get the next one.
      description: |
        The app decides every step of a run and writes its prompt; the runner
        does the step and asks again (decision 2026-11-15-server-decides-steps).
        `ref` is the run's top-level issue. The runner calls this at every step
        boundary: once before the first step, after each agent turn (`run`,
        `resolve`), each `check`, and each base merge that conflicts. It does
        not call it after `publish`, `finish`, `pause`, `fail` or `none`, which
        end what the runner was doing.

        **Stateless (0091).** The app keeps no run or step table. It derives
        the answer from the issue, its sub-issues, comments and usage, and the
        facts in the request. What must survive between two calls and is not
        issue state, such as the attempt count, the fix count and the comment
        cursor, travels in `state`: the app returns it, signed, and the runner
        sends it back unchanged on the next call of the same run. The runner
        keeps it in memory only, so a restart loses it and the next run starts
        with `state: null`; the app then answers from issue state alone. A
        `state` the app cannot verify counts as null.

        **Short.** The request never waits (app decision
        2026-11-07-shared-tables-and-scalability, point 15). It replaces the
        issue and comment reads around each turn, the budget read, the
        progress lines of the steps, the sub-issue claims, moves and report
        comments, and the usage call at the run's end.

        **Writes the app does here.** It stores `last.usage` as one usage
        entry on its issue, as `reportUsage` does. It writes the progress line
        of the step it answers. When it answers a `run` on a To do sub-issue
        it claims it (To do to In progress). After a sub-issue's last step it
        posts that sub-issue's report and moves it to Review; the runner has
        pushed its commit before calling. After a `resolve` it posts the merge
        report. For a trusted team's conflict in Review it sets `merge_status`
        to `issue`. The usage of a repeated `last.id` (the runner retried
        after a lost answer) is stored once; another write may repeat, as an
        outbox write can after a lost answer. Everything that ends a run (the
        final report, the move to Review or Blocked) stays with the runner,
        after its push, through its outbox (CSR-159).

        **Closed set of steps.** `step.kind` is one of the values below, each
        something the runner's open code already does. A step never carries a
        shell command, a path, a docker option, an environment variable or a
        URL; an attachment's `name` is one file name, which the runner refuses
        unless it is already safe. A runner that gets a kind it does not know
        stops the run with an error that names its version, after it
        committed and pushed the work, and the issue goes to Blocked. The app
        sends a new kind only to runners whose `Cinderline-Runner-Version`
        knows it. Both sides ignore properties they do not know.

        | kind | the runner |
        | --- | --- |
        | `run` | Runs the team's `agent` on `issue` with `prompt`, in a new session or the one `sessions` lists for that issue and agent, with an agent token of `token`'s kind or none. It first fills the attachments folder with `attachments`, unless that is null. After a run on a sub-issue it commits as "<ref>: <title>" and pushes. |
        | `resolve` | Runs `agent` on the conflict it reported in `last`, as a `run` on `ref`. It records the head first, then checks the result itself (clean worktree, base and old head both ancestors, no conflict marker, no report that starts with "Blocked") and resets to the old head unless all hold. |
        | `check` | Commits `issue` as "<ref>: <title>", pushes, and runs the project's `check_command` from `getProject` in the clone, without credentials, limited to the team's `max_minutes`. Never in a generic team's run: there the runner treats it as an unknown kind. |
        | `publish` | Commits, merges the base in, pushes `cinderline/<ref>`, opens or finds the pull request, requests and waits for a trusted team's merge, then posts its finish report between `report_head` and `report_foot` and moves `ref` to Review. A conflict in the base merge ends the step with `last.step: merge` when `resolve_conflicts` is true; otherwise the conflict is pushed as it is. Never in a generic team's run, as `check`. |
        | `finish` | Ends without a pull request: pushes the branch (not for a generic run), posts `comment` and moves `ref` to Review. |
        | `pause` | Keeps the paused note with the lead agent's session. With `block` it first commits and pushes the work, then moves `ref` from In progress to Blocked. Posts `comment` unless it is null. |
        | `fail` | Posts `comment` and moves `ref` from In progress to Blocked, as for any run error. Keeps the lead agent's session for a follow-up. |
        | `none` | Nothing: in Review, leaves the branch as it is. In a run, it is an unknown kind. |

        **Merges.** The runner merges the base in itself: before the first
        step of a coding run that continues earlier work (`last` is then the
        conflict, not null), at `publish`, and when it keeps Review branches
        current (`context: review`). The app only decides who, if anyone,
        resolves a conflict. In Review it asks once per pair of branch and
        base commits; it may forget and ask again.

        **When this fails.** The first call of a run failing means the run
        did not start (the issue goes back to To do). A later call is tried
        again after 2 and 8 seconds, as the outbox does; then the runner ends
        the run as a `pause` with `block` and its own comment, through the
        outbox, and sends the usage it holds with `reportUsage`.

        In the examples, `state` is shortened and long prompts are cut with
        "[…]"; the request and response examples with the same name belong
        together.
