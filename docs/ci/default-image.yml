# Draft for Willem (CLR-240): agents may not edit .github/ (AGENTS.md), so
# this file waits here. To put it in place, copy it over
# .github/workflows/default-image.yml without this first paragraph. It is
# that file with one change: the image is built natively for linux/arm64 and
# linux/amd64, each pushed by digest only, then merged into one manifest list
# tagged with the Dockerfile's sum; the attestation and the pin are that
# list's digest (decision 2026-11-24-default-image-amd64).

# Builds images/default/Dockerfile for linux/arm64 and linux/amd64 and pushes
# ghcr.io/rodo-software/cinderline-runner-default:<Dockerfile sum>, one
# manifest list, with build provenance and an SBOM per platform. It runs only
# when the Dockerfile changes on main, or by hand (Actions > default-image >
# Run workflow): runners pull the image by its pinned digest, so rebuilding an
# unchanged Dockerfile on every release tag made nothing new (decision
# 2026-11-12-ci-speedups).
# After a run, the job summary shows the manifest list's digest and the
# Dockerfile's sum. Put them in internal/environment/docker.go as
# publishedDigest and publishedSum and commit; the next release then pulls
# that image. Until then, runners build locally; once pinned, a failed pull
# stops the runs instead (decision 2026-11-24-default-image-amd64). Check the
# attestation with:
#   gh attestation verify oci://ghcr.io/rodo-software/cinderline-runner-default@<digest> --repo rodo-software/cinderline-runner
# The image holds no agent CLIs (decision 2026-11-04-licences-before-publishing):
# they come from the tools volume.
name: default-image
on:
  push:
    branches:
      - main
    paths:
      - images/default/**
      - .github/workflows/default-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write # push to ghcr.io
  id-token: write # attest-build-provenance signs with the workflow's identity
  attestations: write # and stores the attestation on the repository
concurrency:
  group: default-image
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/rodo-software/cinderline-runner-default
jobs:
  build:
    # Each platform on its own native runner, no QEMU (decision 2026-11-12-ci-speedups).
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/default
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=default-image-${{ matrix.arch }}
          cache-to: type=gha,scope=default-image-${{ matrix.arch }},mode=max
      - run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          retention-days: 1
  image:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: sum
        run: echo "sum=$(sha256sum images/default/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One manifest list of both platforms' images, their provenance and
      # SBOMs, tagged with the Dockerfile's sum.
      - id: merge
        run: |
          docker buildx imagetools create --tag "$IMAGE:${{ steps.sum.outputs.sum }}" \
            "$IMAGE@$(cat digest-arm64)" "$IMAGE@$(cat digest-amd64)"
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.sum.outputs.sum }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The repository is public; the step would skip itself on a private one,
      # for which the organization's plan stores no attestations (decision 2026-11-16-attest-when-public).
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Pin
        run: |
          {
            echo "publishedDigest = \"${{ steps.merge.outputs.digest }}\""
            echo "publishedSum = \"${{ steps.sum.outputs.sum }}\""
          } >> "$GITHUB_STEP_SUMMARY"
